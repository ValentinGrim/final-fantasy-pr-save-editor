name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config libgl1-mesa-dev xorg-dev \
            libwayland-dev libxkbcommon-dev gcc-mingw-w64-x86-64 zip

      - name: Install go-winres and generate resources
        run: make setup

      # VERSION is the tag without its leading "v" (v1.4.0 -> 1.4.0).
      # UPX is disabled: packed binaries trigger antivirus false positives.
      - name: Build and package
        run: make package-linux package-windows UPX= VERSION="${TAG#v}"

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum FFPR_Save_Editor-linux-amd64.tar.xz \
            FFPR_Save_Editor-windows-amd64.zip \
            FFPR_Save_Editor.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/FFPR_Save_Editor-linux-amd64.tar.xz
            dist/FFPR_Save_Editor-windows-amd64.zip
            dist/FFPR_Save_Editor.exe
            dist/SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, replacing its assets"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            # Tags like v1.4.0-rc1 are published as pre-releases.
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
